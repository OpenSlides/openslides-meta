fields:
  id:
    type: number
    restriction_mode: A
    constant: true
    required: true
  idp_field:
    type: string
    required: true
    restriction_mode: A
  os_field:
    type: string
    enum:
      - groups
      - structure_levels
      - number
      - vote_weight
      - present
      - comment
    required: true
    restriction_mode: A
  regex:
    type: string
    restriction_mode: A
  mapper_id:
    type: relation
    to: idp_mapper/condition_ids
    restriction_mode: A
    required: true
    reference: idp_mapper